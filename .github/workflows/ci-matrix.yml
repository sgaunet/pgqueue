name: ci-matrix
on:
  push:
  pull_request:
    branches: [main]

jobs:
  # Build + lint every workspace module independently so an issue confined to an
  # optional adapter (or the examples/integration modules) cannot hide behind the
  # root module's green check (H2/FR-008). Each module has its own go.mod; the
  # matrix cd's into each and runs `go build ./...` and `golangci-lint run` there.
  # `go build`/lint are static and need no Docker (only the integration *tests*
  # do, which run in integration-with-mise.yml).
  build-lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - "."
          - "internal/integration"
          - "pglisten"
          - "otelpgqueue"
          - "prompgqueue"
          - "examples"
    steps:
      - uses: actions/checkout@v6

      - uses: jdx/mise-action@v3
        with:
          install: true
          cache: true
      - name: build (${{ matrix.module }})
        working-directory: ${{ matrix.module }}
        run: go build ./...
      - name: lint (${{ matrix.module }})
        working-directory: ${{ matrix.module }}
        run: golangci-lint run
      # Unit tests per module. The optional adapters (pglisten/otelpgqueue/
      # prompgqueue) have unit tests that otherwise run nowhere (#10); the root
      # module is additionally covered by tests-with-mise.yml. internal/integration
      # is excluded here: its tests need a PostgreSQL container and are the
      # dedicated, race-enabled gate in integration-with-mise.yml, which keeps this
      # job static and Docker-free (see the job comment above).
      - name: test (${{ matrix.module }})
        if: matrix.module != 'internal/integration'
        working-directory: ${{ matrix.module }}
        run: go test ./...
      # Scan each module's own dependency graph for known vulnerabilities (#9).
      # Static source analysis (no Docker), so it runs for every module including
      # integration. `go run …@latest` builds govulncheck in module-aware mode,
      # ignoring — and so never mutating — the module's go.mod/go.sum.
      #
      # Report-only for now (continue-on-error), matching the coverage gate's
      # posture: govulncheck also flags Go *stdlib* advisories tied to the
      # toolchain, and mise pins the exact module floor (go 1.25.0), which trails
      # later 1.25.x security patches — a hard gate would go red on those
      # regardless of our own dependencies. Bump the pinned Go patch in mise.toml,
      # then drop `continue-on-error` to make this enforcing.
      - name: govulncheck (${{ matrix.module }})
        continue-on-error: true
        working-directory: ${{ matrix.module }}
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  # Exercise the declared toolchain floor and the current ceiling. The modules
  # declare `go 1.25.0`; without this the floor is never actually run (L15/FR-009).
  # setup-go pins each leg's exact toolchain (mise pins a single version, so a
  # version matrix needs setup-go here); GOTOOLCHAIN=local keeps Go from silently
  # upgrading past the matrix version so the floor leg genuinely runs on 1.25.x.
  go-version:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.25.x", "1.26.x"]
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - run: go build ./...
      - run: go test ./... -race
